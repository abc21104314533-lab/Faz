
name: Windows Desktop Environment

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Show Windows information
        shell: pwsh
        run: |
          Write-Host "Windows environment is ready"
          Get-ComputerInfo |
            Select-Object WindowsProductName,
              WindowsVersion,
              OsArchitecture

      - name: Check software installation tools
        shell: pwsh
        run: |
          if (Get-Command winget -ErrorAction SilentlyContinue) {
            winget --version
          } else {
            Write-Host "WinGet is not available on this runner."
            Write-Host "Use a Windows cloud desktop for GUI software."
          }

      - name: Complete
        shell: pwsh
        run: |
          Write-Host "Workflow completed."
